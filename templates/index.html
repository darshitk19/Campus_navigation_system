<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Navigation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --charusat-blue: #e7f3fb;
            --primary-blue: #007bff;
            --button-hover: #0056b3;
        }

        body {
            background-color: var(--charusat-blue);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.2);
        }

        h2 {
            color: var(--primary-blue);
            font-weight: bold;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--button-hover);
        }

        label {
            font-weight: 500;
        }

        select.form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
    </style>

    <script type="text/javascript">
        const destinationsByStart = JSON.parse('{{ destinations_by_start | tojson | safe }}');

        function updateDestinations() {
            const startSelect = document.getElementById("start");
            const endSelect = document.getElementById("end");
            const selectedStart = startSelect.value;

            endSelect.innerHTML = "";

            if (selectedStart && destinationsByStart[selectedStart]) {
                destinationsByStart[selectedStart].forEach(([code, name]) => {
                    const option = document.createElement("option");
                    option.value = code;
                    option.textContent = name;
                    endSelect.appendChild(option);
                });
            } else {
                const option = document.createElement("option");
                option.textContent = "Select a valid start point";
                endSelect.appendChild(option);
            }
        }

        window.onload = updateDestinations;
    </script>
</head>

<body>

    <div class="container my-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">🎓 Campus Navigation</h2>

            <form action="/map" method="get">
                <div class="mb-3">
                    <label for="start" class="form-label">Select Starting Point</label>
                    <select class="form-select" name="start" id="start" onchange="updateDestinations()" required>
                        <option value="" disabled selected>Choose start point</option>
                        {% for code, name in building_names.items() %}
                            {% if code in destinations_by_start %}
                                <option value="{{ code }}">{{ name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="end" class="form-label">Select Destination</label>
                    <select class="form-select" name="end" id="end" required>
                        <option value="">Choose destination</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Show Path 🧭</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
